services:
  camireads-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_CF_ACCESS_CLIENT_ID: ${NEXT_PUBLIC_CF_ACCESS_CLIENT_ID:-}
        NEXT_PUBLIC_CF_ACCESS_CLIENT_SECRET: ${NEXT_PUBLIC_CF_ACCESS_CLIENT_SECRET:-}
    container_name: camireads-frontend
    ports:
      - "1313:3000"
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_CF_ACCESS_CLIENT_ID=${NEXT_PUBLIC_CF_ACCESS_CLIENT_ID:-}
      - NEXT_PUBLIC_CF_ACCESS_CLIENT_SECRET=${NEXT_PUBLIC_CF_ACCESS_CLIENT_SECRET:-}
    restart: unless-stopped
    networks:
      - camireads-network

  camireads-nginx:
    image: nginx:stable-alpine
    container_name: camireads-nginx
    depends_on:
      - camireads-web
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - camireads-network

networks:
  camireads-network:
    driver: bridge
