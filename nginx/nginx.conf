worker_processes 1;

events {
  worker_connections 1024;
}

http {
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_proxied any;
  gzip_min_length 512;

  upstream camireads_frontend {
    server camireads-web:3000;
  }

  upstream camireads_api {
    server host.docker.internal:9095;
  }

  server {
    listen 80;
    server_name camireads.casapipis.net;

    location ~ ^/_next/static/ {
      proxy_pass http://camireads_frontend;
      proxy_set_header Host $host;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
      proxy_pass http://camireads_api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://camireads_frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
